services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    ports: ["4000:4000"]
    env_file: ./apps/api/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/medlink
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on: [api]

volumes:
  mongo_data:
