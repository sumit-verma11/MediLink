name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/ai/requirements.txt
            apps/ai/requirements-dev.txt
      - run: pip install -r apps/ai/requirements-dev.txt
      - run: ruff check .
        working-directory: apps/ai
      - run: mypy app
        working-directory: apps/ai
      - run: python -m pytest tests
        working-directory: apps/ai
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, ai]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/medlink-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/medlink-${{ matrix.app }}:${{ github.sha }}
